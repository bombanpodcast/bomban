<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bomban Podcast</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
}

.hero{
    padding:40px 20px;
}

.logo img{
    max-width:300px;
    width:100%;
    border-radius:15px;
}

.host-image{
    margin-top:30px;
}

.host-image img{
    max-width:450px;
    width:100%;
    border-radius:15px;
    box-shadow:0 0 25px rgba(255,255,255,0.15);
}

h1{
    margin-top:20px;
    color:#ffb000;
    font-size:48px;
}

.tagline{
    margin-top:15px;
    color:#d1d5db;
    font-size:22px;
}

.buttons{
    margin-top:35px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.btn{
    text-decoration:none;
    color:white;
    padding:15px 25px;
    border-radius:10px;
    font-weight:bold;
}

.spotify{background:#1DB954;}
.instagram{background:#E1306C;}
.tiktok{background:#000000;}
.facebook{background:#1877F2;}
.youtube{background:#FF0000;}

.section{
    max-width:1000px;
    margin:auto;
    padding:60px 20px;
}

iframe{
    border-radius:12px;
}

.sponsors{
    margin-top:60px;
}

.sponsors h2{
    color:#ffb000;
    margin-bottom:20px;
}

.sponsor-box{
    background:#1f2937;
    padding:20px;
    border-radius:12px;
    display:inline-block;
}

footer{
    margin-top:60px;
    padding:30px;
    border-top:1px solid #334155;
    color:#94a3b8;
}
</style>

</head>
<body>

<section class="hero">

<div class="logo">
<img src="logo.jpg" alt="Bomban Podcast">
</div>

<h1>Bomban Podcast</h1>

<p class="tagline">
Fótbolti • Viðtöl • Umræður • Sögur
</p>

<div class="host-image">
<img src="bomban.jpg" alt="Bomban">
</div>

<div class="buttons">

<a class="btn spotify"
href="https://open.spotify.com/show/57XkEv1N7IYs19XHCg15ED"
target="_blank">
🎧 Spotify
</a>

<a class="btn youtube"
href="https://www.youtube.com/@BombanPodcast"
target="_blank">
▶️ YouTube
</a>

<a class="btn instagram"
href="https://instagram.com/bombannnnn"
target="_blank">
📸 Instagram
</a>

<a class="btn tiktok"
href="https://www.tiktok.com/@bomban46"
target="_blank">
🎵 TikTok
</a>

<a class="btn facebook"
href="https://www.facebook.com/profile.php?id=61583887106138"
target="_blank">
👍 Facebook
</a>

</div>

</section>

<section class="section">

<h2>Hlustaðu á Bombuna</h2>

<br>

<iframe
src="https://open.spotify.com/embed/show/57XkEv1N7IYs19XHCg15ED"
width="100%"
height="352"
frameborder="0"
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
</iframe>

<div class="sponsors">

<h2>Í boði styrktaraðila</h2>

<div class="sponsor-box">
Hér birtast styrktaraðilar Bombunnar
</div>

</div>

</section>

<footer>
© 2026 Bomban Podcast • bomban.is
</footer>
