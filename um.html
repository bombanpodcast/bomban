<h1>Um Bombuna</h1>

<p>
Bomban er íslenskt hlaðvarp þar sem Gunnar Hilmar fær til sín áhugaverða gesti úr íslenskum fótbolta.
</p>

<p>
Markmiðið er að ræða fótbolta á skemmtilegan og óhefðbundinn hátt með viðtölum, umræðum og sögum úr heimi íslenska boltans.
</p>
